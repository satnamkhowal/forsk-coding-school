name: Fix course card website URLs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-course-card-urls.yml'
      - 'tools/fix_course_card_urls.py'

permissions:
  contents: write

concurrency:
  group: fix-course-card-urls
  cancel-in-progress: true

jobs:
  fix-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install OCR and image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install pillow pytesseract opencv-python-headless numpy

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Correct forsk.in on course cards and commit one by one
        run: python tools/fix_course_card_urls.py
