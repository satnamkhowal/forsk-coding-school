<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Cloud web application threat matrix for students</title><desc id="d">Illustration of a cloud web application connected to identity, deployment pipeline and cloud resources with security checkpoints.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#134e4a"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#g)"/><text x="70" y="105" fill="#99f6e4" font-family="Arial,sans-serif" font-size="28" font-weight="700">CLOUD SECURITY • LEARNER BRIEFING</text><text x="70" y="185" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="800">Cloud Web App Threat Matrix</text><text x="70" y="240" fill="#dbeafe" font-family="Arial,sans-serif" font-size="27">Think beyond code: identity, pipelines, runtime and cloud resources</text><g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><rect x="80" y="330" width="210" height="105" rx="18" fill="#0f766e"/><text x="185" y="392" fill="#fff" font-size="25">Application Code</text><rect x="360" y="330" width="210" height="105" rx="18" fill="#1d4ed8"/><text x="465" y="392" fill="#fff" font-size="25">Workload Identity</text><rect x="640" y="330" width="210" height="105" rx="18" fill="#7c3aed"/><text x="745" y="392" fill="#fff" font-size="25">CI/CD Pipeline</text><rect x="920" y="330" width="200" height="105" rx="18" fill="#b45309"/><text x="1020" y="392" fill="#fff" font-size="25">Cloud Resources</text></g><path d="M290 382h70M570 382h70M850 382h70" stroke="#bfdbfe" stroke-width="8" stroke-linecap="round"/><text x="70" y="560" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="700">Student lesson: map the whole attack path, not one layer at a time.</text><text x="70" y="610" fill="#a7f3d0" font-family="Arial,sans-serif" font-size="24">Forsk Coding School • September 2026</text></svg>