<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">AWS Deception Benchmark learner illustration</title><desc id="desc">A split-screen illustration comparing a real software vulnerability with a safe code pattern that could trigger an AI false alarm.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071827"/><stop offset="1" stop-color="#172554"/></linearGradient><linearGradient id="safe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#14532d"/></linearGradient><linearGradient id="risk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7f1d1d"/><stop offset="1" stop-color="#431407"/></linearGradient></defs><rect width="1200" height="675" rx="36" fill="url(#bg)"/><text x="70" y="92" fill="#93c5fd" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" letter-spacing="2">AI SECURITY • LEARNER BRIEFING</text><text x="70" y="154" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="800">Can AI tell a real vulnerability</text><text x="70" y="210" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="800">from a convincing false alarm?</text><rect x="70" y="272" width="490" height="280" rx="26" fill="url(#risk)"/><text x="104" y="326" fill="#fecaca" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">REAL VULNERABILITY</text><text x="104" y="382" fill="#fff" font-family="monospace" font-size="23">query = "SELECT ... " + input</text><text x="104" y="433" fill="#fed7aa" font-family="Arial,Helvetica,sans-serif" font-size="21">Reachable risky sink</text><text x="104" y="470" fill="#fed7aa" font-family="Arial,Helvetica,sans-serif" font-size="21">No effective mitigation</text><circle cx="495" cy="492" r="28" fill="#ef4444"/><path d="M482 492l9 9 18-23" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="640" y="272" width="490" height="280" rx="26" fill="url(#safe)"/><text x="674" y="326" fill="#bbf7d0" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">SAFE BUT SUSPICIOUS-LOOKING</text><text x="674" y="382" fill="#fff" font-family="monospace" font-size="23">query(sql, [input])</text><text x="674" y="433" fill="#d1fae5" font-family="Arial,Helvetica,sans-serif" font-size="21">Mitigation closes attack path</text><text x="674" y="470" fill="#d1fae5" font-family="Arial,Helvetica,sans-serif" font-size="21">Context still matters</text><circle cx="1062" cy="492" r="28" fill="#22c55e"/><path d="M1049 492l9 9 18-23" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="620" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="22">AWS Deception Benchmark • verification, false positives, deployment context</text></svg>