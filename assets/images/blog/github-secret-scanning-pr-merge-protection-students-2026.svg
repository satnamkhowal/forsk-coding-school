<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Secure pull request secret scanning</title><desc id="desc">Illustration of a pull request security gate checking for exposed secrets before merge.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#173f78"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-opacity=".28"/></filter></defs><rect width="1200" height="675" rx="36" fill="url(#bg)"/><circle cx="1030" cy="120" r="170" fill="#2563eb" opacity=".16"/><circle cx="140" cy="590" r="210" fill="#14b8a6" opacity=".12"/><g filter="url(#shadow)"><rect x="92" y="82" width="1016" height="511" rx="30" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/><rect x="92" y="82" width="1016" height="72" rx="30" fill="#111827"/><circle cx="137" cy="118" r="10" fill="#ef4444"/><circle cx="171" cy="118" r="10" fill="#f59e0b"/><circle cx="205" cy="118" r="10" fill="#22c55e"/></g><text x="140" y="225" fill="#93c5fd" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2">PULL REQUEST SECURITY</text><text x="140" y="282" fill="#ffffff" font-family="Arial,sans-serif" font-size="46" font-weight="800">Secret scanning before merge</text><text x="140" y="324" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="23">A secure workflow checks credentials before code reaches a protected branch.</text><g transform="translate(150 390)"><rect width="275" height="92" rx="18" fill="#172554" stroke="#60a5fa"/><text x="28" y="38" fill="#bfdbfe" font-family="Arial,sans-serif" font-size="18" font-weight="700">1. Scan completed</text><text x="28" y="66" fill="#dbeafe" font-family="Arial,sans-serif" font-size="15">Check the PR head commit</text></g><g transform="translate(462 390)"><rect width="275" height="92" rx="18" fill="#3f1d1d" stroke="#fb7185"/><text x="28" y="38" fill="#fecdd3" font-family="Arial,sans-serif" font-size="18" font-weight="700">2. Secret alert?</text><text x="28" y="66" fill="#ffe4e6" font-family="Arial,sans-serif" font-size="15">Resolve before merging</text></g><g transform="translate(774 390)"><rect width="275" height="92" rx="18" fill="#052e2b" stroke="#2dd4bf"/><text x="28" y="38" fill="#99f6e4" font-family="Arial,sans-serif" font-size="18" font-weight="700">3. Merge safely</text><text x="28" y="66" fill="#ccfbf1" font-family="Arial,sans-serif" font-size="15">Protect the target branch</text></g><path d="M425 436h37M737 436h37" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/><path d="M449 424l13 12-13 12M761 424l13 12-13 12" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="555" fill="#94a3b8" font-family="Arial,sans-serif" font-size="18">Forsk Coding School • Learner Briefing • September 2026</text></svg>