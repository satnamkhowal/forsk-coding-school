<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
<title id="title">AWS MLA-C02 learner roadmap</title><desc id="desc">Portrait educational poster showing how the updated AWS Machine Learning Engineer Associate exam adds generative AI, RAG, agentic AI and responsible AI.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06131f"/><stop offset="1" stop-color="#12395a"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a7f3d0"/></linearGradient></defs>
<rect width="1080" height="1920" fill="url(#bg)"/><circle cx="860" cy="250" r="300" fill="#1d4ed8" opacity=".17"/><circle cx="220" cy="1660" r="350" fill="#0f766e" opacity=".15"/>
<text x="90" y="180" fill="#a7f3d0" font-family="Arial,sans-serif" font-size="38" font-weight="700" letter-spacing="2">AWS MLA-C02 • 2026</text>
<text x="90" y="340" fill="#fff" font-family="Arial,sans-serif" font-size="86" font-weight="800">ML engineering</text><text x="90" y="440" fill="#fff" font-family="Arial,sans-serif" font-size="86" font-weight="800">now includes</text><text x="90" y="540" fill="#fff" font-family="Arial,sans-serif" font-size="86" font-weight="800">GenAI + agents</text>
<text x="90" y="635" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="40">What students should learn next</text>
<g font-family="Arial,sans-serif" font-size="43" font-weight="700"><rect x="90" y="760" width="900" height="125" rx="28" fill="#0d2740" stroke="#38bdf8" stroke-width="3"/><text x="145" y="840" fill="#fff">01  ML fundamentals still matter</text><rect x="90" y="915" width="900" height="125" rx="28" fill="#0d2740" stroke="#38bdf8" stroke-width="3"/><text x="145" y="995" fill="#fff">02  RAG and foundation models</text><rect x="90" y="1070" width="900" height="125" rx="28" fill="#0d2740" stroke="#a7f3d0" stroke-width="3"/><text x="145" y="1150" fill="#fff">03  Agentic AI workflows</text><rect x="90" y="1225" width="900" height="125" rx="28" fill="#0d2740" stroke="#a7f3d0" stroke-width="3"/><text x="145" y="1305" fill="#fff">04  Bedrock + LLMOps</text><rect x="90" y="1380" width="900" height="125" rx="28" fill="#0d2740" stroke="#a7f3d0" stroke-width="3"/><text x="145" y="1460" fill="#fff">05  Responsible AI</text></g>
<path d="M90 1605 H990" stroke="url(#line)" stroke-width="10" stroke-linecap="round"/><text x="90" y="1695" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Build. Evaluate. Deploy. Monitor.</text><text x="90" y="1800" fill="#a7f3d0" font-family="Arial,sans-serif" font-size="34" font-weight="700">Forsk Coding School learner briefing</text>
