<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="t d"><title id="t">Google ADK for Kotlin 1.0</title><desc id="d">Portrait learner briefing cover about building AI agents with Kotlin, Java and Android.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06131f"/><stop offset=".55" stop-color="#172554"/><stop offset="1" stop-color="#14532d"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#g)"/><circle cx="910" cy="190" r="280" fill="#2563eb" opacity=".16"/><circle cx="140" cy="1730" r="300" fill="#16a34a" opacity=".12"/><text x="76" y="150" fill="#86efac" font-family="Arial,sans-serif" font-size="32" font-weight="700" letter-spacing="4">FORSK CODING SCHOOL</text><text x="76" y="300" fill="#fff" font-family="Arial,sans-serif" font-size="84" font-weight="800">Google ADK</text><text x="76" y="400" fill="#fff" font-family="Arial,sans-serif" font-size="84" font-weight="800">for Kotlin 1.0</text><text x="76" y="480" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="38">5 lessons for AI agent students</text><g font-family="Arial,sans-serif"><rect x="92" y="710" width="390" height="170" rx="32" fill="#111827" stroke="#38bdf8" stroke-width="4"/><text x="287" y="780" text-anchor="middle" fill="#fff" font-size="40" font-weight="700">Kotlin / Java</text><text x="287" y="835" text-anchor="middle" fill="#93c5fd" font-size="28">app + typed tools</text><rect x="600" y="650" width="350" height="160" rx="32" fill="#111827" stroke="#a78bfa" stroke-width="4"/><text x="775" y="720" text-anchor="middle" fill="#fff" font-size="38" font-weight="700">AI Agent</text><text x="775" y="770" text-anchor="middle" fill="#c4b5fd" font-size="27">plan • act • resume</text><rect x="600" y="940" width="350" height="160" rx="32" fill="#111827" stroke="#f59e0b" stroke-width="4"/><text x="775" y="1008" text-anchor="middle" fill="#fff" font-size="36" font-weight="700">Human Approval</text><text x="775" y="1058" text-anchor="middle" fill="#fde68a" font-size="26">pause sensitive actions</text><rect x="92" y="1010" width="390" height="170" rx="32" fill="#111827" stroke="#22c55e" stroke-width="4"/><text x="287" y="1080" text-anchor="middle" fill="#fff" font-size="37" font-weight="700">Session + Memory</text><text x="287" y="1135" text-anchor="middle" fill="#bbf7d0" font-size="27">persist • restore • inspect</text><path d="M482 795 H570" stroke="url(#a)" stroke-width="12" stroke-linecap="round"/><path d="M775 810 V910" stroke="url(#a)" stroke-width="12" stroke-linecap="round"/><path d="M482 1095 C545 1095 545 755 570 755" fill="none" stroke="url(#a)" stroke-width="12" stroke-linecap="round"/></g><text x="76" y="1425" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="800">Build agents that are</text><text x="76" y="1492" fill="#86efac" font-family="Arial,sans-serif" font-size="48" font-weight="800">testable, explainable</text><text x="76" y="1559" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="800">and appropriately constrained.</text><text x="76" y="1770" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="30">Tools • approval gates • sessions</text><text x="76" y="1815" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="30">multi-agent design • testing</text></svg>