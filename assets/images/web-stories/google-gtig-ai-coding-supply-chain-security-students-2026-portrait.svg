<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="t d"><title id="t">AI coding security lessons</title><desc id="d">Portrait web story poster about defensive AI-assisted development skills.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset=".55" stop-color="#0f766e"/><stop offset="1" stop-color="#164e63"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#g)"/><circle cx="900" cy="260" r="280" fill="#38bdf8" opacity=".10"/><circle cx="170" cy="1680" r="360" fill="#a7f3d0" opacity=".08"/><g font-family="Arial,sans-serif" fill="#fff"><text x="80" y="145" font-size="34" font-weight="700" letter-spacing="3">FORSK CODING SCHOOL</text><text x="80" y="330" font-size="86" font-weight="800">AI CODING</text><text x="80" y="425" font-size="86" font-weight="800">SECURITY</text><text x="80" y="505" font-size="38" opacity=".9">5 defensive lessons for students</text></g><g font-family="Arial,sans-serif"><rect x="80" y="650" width="920" height="170" rx="30" fill="#fff" opacity=".96"/><text x="125" y="715" font-size="34" font-weight="700" fill="#0f172a">1  Verify dependencies</text><text x="125" y="770" font-size="27" fill="#334155">AI suggestions still cross trust boundaries.</text><rect x="80" y="850" width="920" height="170" rx="30" fill="#fff" opacity=".96"/><text x="125" y="915" font-size="34" font-weight="700" fill="#0f172a">2  Review workspace config</text><text x="125" y="970" font-size="27" fill="#334155">Agent and IDE instructions can influence execution.</text><rect x="80" y="1050" width="920" height="170" rx="30" fill="#fff" opacity=".96"/><text x="125" y="1115" font-size="34" font-weight="700" fill="#0f172a">3  Protect CI/CD credentials</text><text x="125" y="1170" font-size="27" fill="#334155">Use least privilege and review workflow changes.</text><rect x="80" y="1250" width="920" height="170" rx="30" fill="#fff" opacity=".96"/><text x="125" y="1315" font-size="34" font-weight="700" fill="#0f172a">4  Keep human approval</text><text x="125" y="1370" font-size="27" fill="#334155">Sensitive actions should not become silent automation.</text><rect x="80" y="1450" width="920" height="170" rx="30" fill="#fff" opacity=".96"/><text x="125" y="1515" font-size="34" font-weight="700" fill="#0f172a">5  Confidence ≠ evidence</text><text x="125" y="1570" font-size="27" fill="#334155">Verify source, permissions, behavior and tests.</text></g><g font-family="Arial,sans-serif" fill="#d1fae5"><text x="80" y="1745" font-size="28" font-weight="700">Based on Google Threat Intelligence research</text><text x="80" y="1790" font-size="26">Published 8 September 2026</text></g></svg>