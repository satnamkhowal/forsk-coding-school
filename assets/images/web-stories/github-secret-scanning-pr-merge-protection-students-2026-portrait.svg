<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc"><title id="title">GitHub secret scanning lessons for students</title><desc id="desc">Portrait Web Story poster about blocking pull request merges when secrets are exposed.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset=".55" stop-color="#123c72"/><stop offset="1" stop-color="#0f766e"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#bg)"/><circle cx="870" cy="250" r="280" fill="#3b82f6" opacity=".16"/><circle cx="170" cy="1660" r="360" fill="#14b8a6" opacity=".12"/><text x="78" y="160" fill="#bfdbfe" font-family="Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="4">GITHUB • SECURE CODING</text><text x="78" y="320" fill="#ffffff" font-family="Arial,sans-serif" font-size="92" font-weight="800"><tspan x="78" dy="0">STOP SECRETS</tspan><tspan x="78" dy="105">BEFORE</tspan><tspan x="78" dy="105">THE MERGE</tspan></text><text x="78" y="690" fill="#dbeafe" font-family="Arial,sans-serif" font-size="43"><tspan x="78" dy="0">5 lessons from GitHub's new</tspan><tspan x="78" dy="62">pull-request protection</tspan></text><g transform="translate(78 865)"><rect width="924" height="500" rx="44" fill="#0f172a" opacity=".9" stroke="#60a5fa" stroke-width="3"/><text x="55" y="88" fill="#93c5fd" font-family="Arial,sans-serif" font-size="30" font-weight="700">SECURE WORKFLOW</text><g transform="translate(55 145)"><rect width="230" height="120" rx="22" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="32" y="50" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">SCAN</text><text x="32" y="86" fill="#bfdbfe" font-family="Arial,sans-serif" font-size="20">PR head commit</text></g><g transform="translate(347 145)"><rect width="230" height="120" rx="22" fill="#451a1a" stroke="#fb7185" stroke-width="2"/><text x="32" y="50" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">RESOLVE</text><text x="32" y="86" fill="#fecdd3" font-family="Arial,sans-serif" font-size="20">secret alerts</text></g><g transform="translate(639 145)"><rect width="230" height="120" rx="22" fill="#052e2b" stroke="#2dd4bf" stroke-width="2"/><text x="32" y="50" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">MERGE</text><text x="32" y="86" fill="#99f6e4" font-family="Arial,sans-serif" font-size="20">protected branch</text></g><path d="M285 205h62M577 205h62" stroke="#cbd5e1" stroke-width="7"/><path d="M328 188l19 17-19 17M620 188l19 17-19 17" fill="none" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="365" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="28"><tspan x="55" dy="0">Keep credentials out of source code.</tspan><tspan x="55" dy="45">Use layers. Rotate exposed keys.</tspan><tspan x="55" dy="45">Know what automation does not cover.</tspan></text></g><text x="78" y="1570" fill="#ffffff" font-family="Arial,sans-serif" font-size="46" font-weight="700">Forsk Coding School</text><text x="78" y="1630" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="28">Learner Briefing • September 2026</text><rect x="78" y="1715" width="420" height="82" rx="41" fill="#ffffff"/><text x="128" y="1768" fill="#0f172a" font-family="Arial,sans-serif" font-size="30" font-weight="700">Read the full story →</text></svg>