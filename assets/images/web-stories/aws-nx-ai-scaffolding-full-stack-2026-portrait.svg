<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc"><title id="title">AWS Nx AI scaffolding web story cover</title><desc id="desc">Portrait cover for a learner web story about production-ready full-stack AI scaffolding on AWS.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset=".55" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0f766e"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#g)"/><circle cx="920" cy="280" r="260" fill="#38bdf8" opacity=".14"/><circle cx="140" cy="1650" r="320" fill="#a78bfa" opacity=".12"/><g font-family="Arial,Helvetica,sans-serif" fill="#fff"><text x="90" y="220" font-size="42" font-weight="700">FORSK CODING SCHOOL</text><text x="90" y="520" font-size="92" font-weight="800">AI can scaffold</text><text x="90" y="630" font-size="92" font-weight="800">the stack.</text><text x="90" y="790" font-size="55" fill="#bfdbfe">You still need to</text><text x="90" y="865" font-size="55" fill="#bfdbfe">understand production.</text><rect x="90" y="1030" width="900" height="380" rx="42" fill="#fff" opacity=".1"/><text x="145" y="1145" font-size="46" font-weight="700">AWS Nx Plugin v1.0</text><text x="145" y="1230" font-size="38">React • APIs • Databases</text><text x="145" y="1300" font-size="38">Agents • CDK / Terraform</text><text x="145" y="1370" font-size="38">Security • Observability</text><text x="90" y="1740" font-size="34" fill="#dbeafe">Learner briefing • September 2026</text></g></svg>