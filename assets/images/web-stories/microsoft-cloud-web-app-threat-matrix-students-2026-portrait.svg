<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="t d"><title id="t">Cloud web application threat matrix lessons</title><desc id="d">Portrait poster for a student web story about cloud web application security.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#115e59"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#g)"/><text x="80" y="170" fill="#99f6e4" font-family="Arial,sans-serif" font-size="44" font-weight="700">CLOUD SECURITY</text><text x="80" y="330" fill="#fff" font-family="Arial,sans-serif" font-size="92" font-weight="800">Threat Matrix</text><text x="80" y="440" fill="#fff" font-family="Arial,sans-serif" font-size="92" font-weight="800">for Web Apps</text><text x="80" y="555" fill="#dbeafe" font-family="Arial,sans-serif" font-size="44">5 lessons for coding, cloud</text><text x="80" y="615" fill="#dbeafe" font-family="Arial,sans-serif" font-size="44">and cybersecurity students</text><g font-family="Arial,sans-serif" font-size="40" font-weight="700"><rect x="90" y="800" width="900" height="150" rx="30" fill="#0f766e"/><text x="140" y="890" fill="#fff">Code → Identity → Pipeline → Cloud</text><rect x="90" y="1010" width="900" height="150" rx="30" fill="#1d4ed8"/><text x="140" y="1100" fill="#fff">One attack path can cross every layer</text><rect x="90" y="1220" width="900" height="150" rx="30" fill="#7c3aed"/><text x="140" y="1310" fill="#fff">Map, harden, monitor, verify</text></g><text x="80" y="1700" fill="#a7f3d0" font-family="Arial,sans-serif" font-size="42" font-weight="700">Forsk Coding School</text><text x="80" y="1770" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="32">Learner briefing • September 2026</text></svg>