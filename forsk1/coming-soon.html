<!DOCTYPE html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Education LMS and Online course template">

  <!-- Site Title -->
  <title>Edunex - Education LMS & Online course HTML Template</title>

  <!-- Place favicon.ico in the root directory -->
  <link rel="shortcut icon" type="image/x-icon" href="assets/images/favicon.png">

  <!-- CSS here -->
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/edunex-icons.css">
  <link rel="stylesheet" href="assets/css/nice-select.css">
  <link rel="stylesheet" href="assets/css/swiper.min.css">
  <link rel="stylesheet" href="assets/css/venobox.min.css">
  <link rel="stylesheet" href="assets/css/meanmenu.css">
  <link rel="stylesheet" href="assets/css/main.css">
</head>

<body>
  <div class="body-overlay"></div>

  <!-- Preloader Start -->
  <div class="preloader is-loading">
    <div class="loading-container">
      <div class="loading"></div>
      <div id="loading-icon"><img src="assets/images/logos/logo-icon.png" alt="Loading"></div>
    </div>
  </div>
  <!-- Preloader End -->

  <!-- Coming soon start -->
  <section class="tj-coming-soon-section">
    <div class="tj_coming_soon" data-bg-image="assets/images/bg/coming-soon-bg.webp">
      <div class="tj_coming_soon_wrap">
        <div class="tj_coming_soon_content">
          <span class="sec-subtitle"><i class="tji-subtitle"></i> Something new is brewing</span>
          <h1 class="title">Coming Soon</h1>
          <div class="desc">We're putting the finishing touches on something special. Leave your email and be the first
            to know when we launch.</div>
        </div>

        <div class="countdown" data-date="2027-01-31 12:00:00" data-day_label="Days" data-hour_label="Hours"
          data-min_label="Mins" data-sec_label="Sec">
          <div class="countdown-container days">
            <span class="countdown-value">00</span>
            <span class="countdown-heading">Days</span>
          </div>

          <div class="countdown-container hours">
            <span class="countdown-value">00</span>
            <span class="countdown-heading">Hours</span>
          </div>

          <div class="countdown-container minutes">
            <span class="countdown-value">00</span>
            <span class="countdown-heading">Mins</span>
          </div>

          <div class="countdown-container seconds">
            <span class="countdown-value">00</span>
            <span class="countdown-heading">Sec</span>
          </div>
        </div>

        <div class="query_form">
          <form action="coming-soon.html#">
            <span class="icon"><i class="tji-envelope"></i></span>
            <input type="email" name="email" placeholder="Enter email">
            <button type="submit" class="tj-btn-primary tj-btn-primary-sm flip-text-wrap">
              <span class="btn-text">Notify me</span>
              <span class="btn-icon"><i class="tji-arrow-right-2"></i></span>
            </button>
          </form>
          <span class="form_note"><i class="tji-guarantee"></i> No spam — just one launch email.</span>
        </div>
        <div class="coming-soon-social">
          <ul class="tj-socials tj-socials-2">
            <li>
              <a href="https://facebook.com" target="_blank"><i class="tji-facebook"></i></a>
            </li>
            <li>
              <a href="https://instagram.com" target="_blank"><i class="tji-instagram"></i></a>
            </li>
            <li>
              <a href="https://x.com" target="_blank"><i class="tji-x-twitter"></i></a>
            </li>
            <li>
              <a href="https://linkedin.com/" target="_blank"><i class="tji-linkedin"></i></a>
            </li>
          </ul>
        </div>
        <div class="coming-soon-copyright d-flex justify-content-center">
          <div class="tj-copyright-text">
            <p> &copy;<span>2026</span> <a href="https://themeforest.net/user/theme-junction/portfolio"
                target="_blank">Edunex</a>. All rights reserved
            </p>
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- Coming soon end -->

  <!-- JS here -->
  <script src="assets/js/jquery.min.js"></script>
  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/gsap.min.js"></script>
  <script src="assets/js/gsap-scroll-smoother.js"></script>
  <script src="assets/js/gsap-scroll-to-plugin.min.js"></script>
  <script src="assets/js/gsap-scroll-trigger.min.js"></script>
  <script src="assets/js/gsap-split-text.min.js"></script>
  <script src="assets/js/jquery.nice-select.min.js"></script>
  <script src="assets/js/swiper.min.js"></script>
  <script src="assets/js/venobox.min.js"></script>
  <script src="assets/js/gsap-animation.js"></script>
  <script src="assets/js/meanmenu.js"></script>
  <script src="assets/js/imagesloaded-pkgd.js"></script>
  <script src="assets/js/isotope.pkgd.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
